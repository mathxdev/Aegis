<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aegis | Visitante</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="totem">

        <div class="logo">
            AEGIS
        </div>

        <p class="subtitle">
            ACESSO DE VISITANTE
        </p>

        <form class="visitor-form" id="visitorForm">

            <input
                type="text"
                id="nome"
                placeholder="Nome completo"
                required
            >

            <input
                type="text"
                id="pessoaVisitada"
                placeholder="Pessoa que deseja visitar"
                required
            >

            <input
                type="text"
                id="motivo"
                placeholder="Motivo da visita"
                required
            >

            <button
                type="submit"
                class="btn btn-primary"
            >
                REGISTRAR VISITA
            </button>

        </form>

        <button
            class="btn btn-secondary"
            onclick="window.location.href='painel.html'"
        >
            VOLTAR
        </button>

    </main>

    <script>

        const form = document.getElementById("visitorForm");

        form.addEventListener("submit", async (event) => {

            event.preventDefault();

            const nome =
                document.getElementById("nome").value;

            const pessoaVisitada =
                document.getElementById("pessoaVisitada").value;

            const motivo =
                document.getElementById("motivo").value;

            try {

                const resposta = await fetch(
                    "/api/visitantes",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            nome: nome,
                            pessoaVisitada: pessoaVisitada,
                            motivo: motivo
                        })
                    }
                );

                const dados = await resposta.json();

                if (!resposta.ok) {

                    alert(dados.mensagem);
                    return;

                }

                alert(dados.mensagem);

                form.reset();

            } catch (erro) {

                console.error(
                    "Erro ao registrar visitante:",
                    erro
                );

                alert(
                    "Não foi possível conectar ao servidor."
                );
            }

        });

    </script>

</body>

</html>
