<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aegis | Identificação</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="totem">

        <div class="logo">
            AEGIS
        </div>

        <p class="subtitle">
            IDENTIFICAÇÃO
        </p>

        <form class="login-form" id="loginForm">

            <div class="input-group">
                <input
                    type="text"
                    id="usuario"
                    placeholder="Usuário"
                    required
                >
            </div>

            <div class="input-group">
                <input
                    type="password"
                    id="senha"
                    placeholder="Senha"
                    required
                >
            </div>

            <button
                type="submit"
                class="btn btn-primary"
            >
                ACESSAR
            </button>

        </form>

        <button
            class="btn btn-secondary"
            onclick="window.location.href='index.html'"
        >
            VOLTAR
        </button>

    </main>

</body>

</html>
