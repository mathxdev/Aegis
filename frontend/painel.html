<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aegis | Painel</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="totem">

        <div class="logo">
            AEGIS
        </div>

        <p class="subtitle">
            PAINEL DE CONTROLE
        </p>

        <p id="usuarioLogado">
            Verificando sessão...
        </p>

        <div class="actions">

            <button
                class="btn btn-primary"
                onclick="window.location.href='visitante.html'"
            >
                REGISTRAR VISITANTE
            </button>

            <button
                class="btn btn-secondary"
                onclick="sair()"
            >
                SAIR
            </button>

        </div>

    </main>

    <script>

        async function verificarSessao() {

            try {

                const resposta = await fetch("/api/sessao");

                if (!resposta.ok) {
                    window.location.href = "login.html";
                    return;
                }

                const dados = await resposta.json();

                document.getElementById("usuarioLogado").textContent =
                    `Usuário: ${dados.usuario.nome}`;

            } catch (erro) {

                console.error(
                    "Erro ao verificar sessão:",
                    erro
                );

                window.location.href = "login.html";
            }
        }

        async function sair() {

            await fetch("/api/logout", {
                method: "POST"
            });

            window.location.href = "index.html";
        }

        verificarSessao();

    </script>

</body>

</html>
