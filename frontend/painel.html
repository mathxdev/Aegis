<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aegis | Painel</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="totem">

        <div class="logo">
            AEGIS
        </div>

        <p class="subtitle">
            PAINEL DE CONTROLE
        </p>

        <p id="usuarioLogado" class="user-info">
            Verificando sessão...
        </p>

        <div class="actions">

            <button
                class="btn btn-primary"
                onclick="window.location.href='visitante.html'"
            >
                REGISTRAR VISITANTE
            </button>

            <button
                class="btn btn-secondary"
                onclick="sair()"
            >
                SAIR
            </button>

        </div>

        <section class="visitantes">

            <h2>VISITANTES REGISTRADOS</h2>

            <p id="mensagemVisitantes">
                Carregando visitantes...
            </p>

            <div id="listaVisitantes"></div>

        </section>

    </main>

    <script>

        // ==========================================
        // VERIFICA A SESSÃO
        // ==========================================

        async function verificarSessao() {

            try {

                const resposta = await fetch("/api/sessao");

                if (!resposta.ok) {
                    window.location.href = "login.html";
                    return false;
                }

                const dados = await resposta.json();

                document.getElementById(
                    "usuarioLogado"
                ).textContent =
                    `Usuário: ${dados.usuario.nome}`;

                return true;

            } catch (erro) {

                console.error(
                    "Erro ao verificar sessão:",
                    erro
                );

                window.location.href = "login.html";

                return false;
            }
        }

        // ==========================================
        // CARREGA VISITANTES
        // ==========================================

        async function carregarVisitantes() {

            try {

                const resposta = await fetch(
                    "/api/visitantes"
                );

                if (!resposta.ok) {

                    document.getElementById(
                        "mensagemVisitantes"
                    ).textContent =
                        "Não foi possível carregar os visitantes.";

                    return;
                }

                const dados = await resposta.json();

                const lista =
                    document.getElementById(
                        "listaVisitantes"
                    );

                const mensagem =
                    document.getElementById(
                        "mensagemVisitantes"
                    );

                lista.innerHTML = "";

                if (dados.visitantes.length === 0) {

                    mensagem.textContent =
                        "Nenhum visitante registrado.";

                    return;
                }

                mensagem.textContent =
                    `${dados.visitantes.length} visitante(s) registrado(s).`;

                dados.visitantes.forEach((visitante) => {

                    const registro =
                        document.createElement("div");

                    registro.className =
                        "visitante-card";

                    registro.innerHTML = `
                        <strong>${visitante.nome}</strong>

                        <span>
                            Visitando:
                            ${visitante.pessoaVisitada}
                        </span>

                        <span>
                            Motivo:
                            ${visitante.motivo}
                        </span>

                        <span>
                            Data:
                            ${visitante.dataHora}
                        </span>

                        <span>
                            Registrado por:
                            ${visitante.registradoPor}
                        </span>
                    `;

                    lista.appendChild(registro);

                });

            } catch (erro) {

                console.error(
                    "Erro ao carregar visitantes:",
                    erro
                );

                document.getElementById(
                    "mensagemVisitantes"
                ).textContent =
                    "Erro ao conectar ao servidor.";
            }
        }

        // ==========================================
        // LOGOUT
        // ==========================================

        async function sair() {

            try {

                await fetch(
                    "/api/logout",
                    {
                        method: "POST"
                    }
                );

            } catch (erro) {

                console.error(
                    "Erro ao sair:",
                    erro
                );
            }

            window.location.href = "index.html";
        }

        // ==========================================
        // INICIALIZAÇÃO
        // ==========================================

        async function iniciarPainel() {

            const autenticado =
                await verificarSessao();

            if (autenticado) {
                await carregarVisitantes();
            }
        }

        iniciarPainel();

    </script>

</body>

</html>
