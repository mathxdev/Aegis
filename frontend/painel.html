<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aegis | Painel</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="totem">

        <div class="logo">
            AEGIS
        </div>

        <p class="subtitle">
            PAINEL DE CONTROLE
        </p>

        <p id="usuarioLogado" class="user-info">
            Verificando sessão...
        </p>

        <div class="actions">

            <button
                class="btn btn-primary"
                onclick="window.location.href='visitante.html'"
            >
                REGISTRAR VISITANTE
            </button>

            <button
                class="btn btn-secondary"
                onclick="sair()"
            >
                SAIR
            </button>

        </div>

        <section class="visitantes">

            <h2>VISITANTES REGISTRADOS</h2>

            <input
                type="text"
                id="buscaVisitante"
                class="busca-visitante"
                placeholder="Buscar visitante..."
                oninput="filtrarVisitantes()"
            >

            <p id="mensagemVisitantes">
                Carregando visitantes...
            </p>

            <div id="listaVisitantes"></div>

        </section>

    </main>

    <script>

        let visitantes = [];

        // ==========================================
        // VERIFICA A SESSÃO
        // ==========================================

        async function verificarSessao() {

            try {

                const resposta = await fetch("/api/sessao");

                if (!resposta.ok) {
                    window.location.href = "login.html";
                    return false;
                }

                const dados = await resposta.json();

                document.getElementById(
                    "usuarioLogado"
                ).textContent =
                    `Usuário: ${dados.usuario.nome}`;

                return true;

            } catch (erro) {

                console.error(
                    "Erro ao verificar sessão:",
                    erro
                );

                window.location.href = "login.html";

                return false;
            }
        }

        // ==========================================
        // CARREGA VISITANTES
        // ==========================================

        async function carregarVisitantes() {

            try {

                const resposta = await fetch(
                    "/api/visitantes"
                );

                if (!resposta.ok) {

                    document.getElementById(
                        "mensagemVisitantes"
                    ).textContent =
                        "Não foi possível carregar os visitantes.";

                    return;
                }

                const dados = await resposta.json();

                visitantes = dados.visitantes;

                exibirVisitantes(visitantes);

            } catch (erro) {

                console.error(
                    "Erro ao carregar visitantes:",
                    erro
                );

                document.getElementById(
                    "mensagemVisitantes"
                ).textContent =
                    "Erro ao conectar ao servidor.";
            }
        }

        // ==========================================
        // EXIBE VISITANTES
        // ==========================================

        function exibirVisitantes(listaVisitantes) {

            const lista =
                document.getElementById(
                    "listaVisitantes"
                );

            const mensagem =
                document.getElementById(
                    "mensagemVisitantes"
                );

            lista.innerHTML = "";

            if (listaVisitantes.length === 0) {

                mensagem.textContent =
                    "Nenhum visitante encontrado.";

                return;
            }

            mensagem.textContent =
                `${listaVisitantes.length} visitante(s) encontrado(s).`;

            listaVisitantes.forEach((visitante) => {

                const registro =
                    document.createElement("div");

                registro.className =
                    "visitante-card";

                const nome =
                    document.createElement("strong");

                nome.textContent =
                    visitante.nome;

                const pessoa =
                    document.createElement("span");

                pessoa.textContent =
                    `Visitando: ${visitante.pessoaVisitada}`;

                const motivo =
                    document.createElement("span");

                motivo.textContent =
                    `Motivo: ${visitante.motivo}`;

                const data =
                    document.createElement("span");

                data.textContent =
                    `Data: ${visitante.dataHora}`;

                const registradoPor =
                    document.createElement("span");

                registradoPor.textContent =
                    `Registrado por: ${visitante.registradoPor}`;

                registro.appendChild(nome);
                registro.appendChild(pessoa);
                registro.appendChild(motivo);
                registro.appendChild(data);
                registro.appendChild(registradoPor);

                lista.appendChild(registro);

            });
        }

        // ==========================================
        // FILTRO DE VISITANTES
        // ==========================================

        function filtrarVisitantes() {

            const busca =
                document.getElementById(
                    "buscaVisitante"
                ).value
                .toLowerCase()
                .trim();

            const filtrados =
                visitantes.filter((visitante) => {

                    return (
                        visitante.nome
                            .toLowerCase()
                            .includes(busca)
                        ||
                        visitante.pessoaVisitada
                            .toLowerCase()
                            .includes(busca)
                    );

                });

            exibirVisitantes(filtrados);
        }

        // ==========================================
        // LOGOUT
        // ==========================================

        async function sair() {

            try {

                await fetch(
                    "/api/logout",
                    {
                        method: "POST"
                    }
                );

            } catch (erro) {

                console.error(
                    "Erro ao sair:",
                    erro
                );
            }

            window.location.href = "index.html";
        }

        // ==========================================
        // INICIALIZAÇÃO
        // ==========================================

        async function iniciarPainel() {

            const autenticado =
                await verificarSessao();

            if (autenticado) {
                await carregarVisitantes();
            }
        }

        iniciarPainel();

    </script>

</body>

</html>
